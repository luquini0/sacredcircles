<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sacred Circles</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>


<body>

<!-- ANIMATED 3D BACKGROUND -->

<canvas id="webgl"></canvas>

<div id="loader"></div>

<!-- LOGO / HEADER CENTRAL -->

<header class="main-header">

<h1 class="logo">Sacred Circles</h1>
<p class="tagline">Sacred geometry &amp; mandala art</p>

</header>



<!-- SPACER (background scene shows through) -->

<section class="viewer-section"></section>



<!-- PRODUCT INFO -->

<section class="product-section">

<h2>Libro de Mandalas</h2>

<p>
A collection of sacred geometric mandalas designed for meditation,
creativity and inner exploration.
</p>

<a href="https://mpago.la/11P89Mz" target="_blank" class="buy-button">
Comprar ahora
</a>

<p class="trust-line">Pago seguro &middot; Entrega digital</p>

</section>

<footer class="site-footer">
&copy; Sacred Circles
</footer>


<script src="app.js"></script>
<script>
document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", function(e) {

if (e.key === "F12") {
    e.preventDefault();
}

if (e.ctrlKey && e.shiftKey && e.key === "I") {
    e.preventDefault();
}

if (e.ctrlKey && e.key === "u") {
    e.preventDefault();
}

});
document.querySelectorAll("img").forEach(img=>{
img.setAttribute("draggable","false");
});  
</script>
</body>

</html>
